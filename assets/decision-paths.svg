<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Three ways to use a learned world model</title><desc id="desc">Online planning optimizes action sequences; imagination trains an actor; tree search uses reward, value and policy predictions.</desc>
